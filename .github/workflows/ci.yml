name: molecular-workstation-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The expanded R07/R08 browser matrix runs the full 110-test E2E suite.
    # The real 3D viewer/manual-gate cases are intentionally serialized and
    # require more than the prior 30-minute budget on hosted runners.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Emit Playwright failure annotations so hosted-only assertions remain
      # diagnosable from the public check without requiring log access.
      - run: npm run test:e2e -- --reporter=github
