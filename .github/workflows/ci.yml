name: molecular-workstation-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The expanded R07 browser matrix runs the full 100-test E2E suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
